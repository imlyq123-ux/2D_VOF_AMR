# static_drop.cfg - example configuration (values = the built-in case defaults).
#
# Static drop (Laplace equilibrium, spurious currents), cf. Popinet, JCP 228 (2009) 5838.
# Drop of phase 1, D = 0.4, centred in [0,1]^2; rho = 1, sigma = 1, Laplace number
# La = sigma rho D / mu^2 = 12000 (mu = 5.7735e-3); no gravity; no-slip walls. Exact solution:
# u = 0, pressure jump sigma / R = 5. Capillary time sqrt(rho D^3 / sigma) = 0.253.
#
# Usage: vof2d cases/static_drop.cfg [key=value ...]   (command line overrides the file)
# Syntax: key = value; '#' starts a comment. The case defaults are applied first, so any
# line may be deleted. Booleans: true/false/1/0.

# ---- case / output
caseName = static_drop           # test case (see cases.hpp / vof2d --help)
outDir = output/static_drop      # output directory
outputEvery = 0.25               # simulated time between VTK dumps (<= 0: never)
diagEvery = 1                    # steps between diagnostics lines

# ---- domain and mesh: nx0 x ny0 root cells of size L0, lower-left corner (x0, y0)
nx0 = 1                          # root cells in x
ny0 = 1                          # root cells in y
x0 = 0                           # domain lower-left x
y0 = 0                           # domain lower-left y
L0 = 1                           # root cell size
minLevel = 3                     # coarsest leaf level (h = L0 / 2^level)
maxLevel = 6                     # finest leaf level (interface region)

# ---- fluids: phase 1 is where f = 1, phase 2 where f = 0
rho1 = 1                         # density of phase 1
rho2 = 1                         # density of phase 2
mu1 = 0.005773502691896258       # dynamic viscosity of phase 1
mu2 = 0.005773502691896258       # dynamic viscosity of phase 2
sigma = 1                        # surface tension coefficient
rejectUnresolvedCurvature = false # no surface tension on sub-cell structures (true/false)
gx = 0                           # gravity x
gy = 0                           # gravity y

# ---- time integration
tEnd = 5                         # final time
cfl = 0.25                       # advective CFL number (<= 0.5)
dtMax = 0.01                     # maximum time step
dtMin = 1e-12                    # abort if the time step falls below this
maxSteps = 100000000             # maximum number of time steps
implicitViscosity = true         # implicit viscous term (true/false)

# ---- boundary conditions: wall|slip|inflow|outflow|periodic; _u, _v: wall (lid) or inflow velocity; _f: inflow volume fraction
bc_left = wall                   # type
bc_left_u = 0                    # x velocity
bc_left_v = 0                    # y velocity
bc_left_f = 0                    # inflow volume fraction
bc_right = wall                  # type
bc_right_u = 0                   # x velocity
bc_right_v = 0                   # y velocity
bc_right_f = 0                   # inflow volume fraction
bc_bottom = wall                 # type
bc_bottom_u = 0                  # x velocity
bc_bottom_v = 0                  # y velocity
bc_bottom_f = 0                  # inflow volume fraction
bc_top = wall                    # type
bc_top_u = 0                     # x velocity
bc_top_v = 0                     # y velocity
bc_top_f = 0                     # inflow volume fraction

# ---- adaptivity
adaptEvery = 2                   # steps between regrids
interfaceBuffer = 4              # max-level cells kept around the interface
uTol = 0.01                      # velocity wavelet threshold (absolute)
adaptVelocity = false            # use the velocity criterion away from the interface

# ---- linear solver
poissonTol = 1e-09               # relative residual tolerance
poissonMaxIter = 1000            # maximum iterations

# ---- kinematic runs (prescribed stream function, no Navier-Stokes)
vofOnly = false                  # advect f with the case's stream function only
period = 0                       # period of time-reversing prescribed flows
