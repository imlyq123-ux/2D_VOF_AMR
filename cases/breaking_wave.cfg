# breaking_wave.cfg - example configuration (values = the built-in case defaults).
#
# Plunging breaking wave of Deike, Popinet & Melville, J. Fluid Mech. 769 (2015) 541-569,
# in units k = 1, g = 1 (wavelength 2 pi): domain [-pi, pi]^2, periodic in x, depth pi
# (h / lambda = 1/2), free-slip top/bottom. Third-order Stokes wave (Lamb 1932, their
# eqs. 2.3-2.4) of steepness eps = ak = 0.55; velocity from the potential in the water,
# air at rest. Re = sqrt(g lambda^3)/nu_w = 40000, Bo = (rho_w - rho_a) g/(sigma k^2) = 1000,
# rho_a/rho_w = 1/850, mu_a/mu_w = 1.96e-2. Wave period T = 2 pi; runs 4 periods.
# Reference: ~70% of the wave energy dissipated after 4 periods (their figs. 8-9); breaking
# stage E = E(T) exp(-0.22 t) for t/T in [1, 2] (t in units of sqrt(lambda/g)).
# Energy panel in the video: scripts/make_video.py <outDir> --wave-energy
# Momentum-conserving advection is on (density ratio 850). Lower maxLevel for a quick run.
#
# Usage: vof2d cases/breaking_wave.cfg [key=value ...]   (command line overrides the file)
# Syntax: key = value; '#' starts a comment. The case defaults are applied first, so any
# line may be deleted. Booleans: true/false/1/0.

# ---- case / output
caseName = breaking_wave         # test case (see cases.hpp / vof2d --help)
outDir = output/breaking_wave    # output directory
outputEvery = 0.1                # simulated time between VTK dumps (<= 0: never)
diagEvery = 1                    # steps between diagnostics lines

# ---- domain and mesh: nx0 x ny0 root cells of size L0, lower-left corner (x0, y0)
nx0 = 1                          # root cells in x
ny0 = 1                          # root cells in y
x0 = -3.141592653589793          # domain lower-left x
y0 = -3.141592653589793          # domain lower-left y
L0 = 6.283185307179586           # root cell size
minLevel = 4                     # coarsest leaf level (h = L0 / 2^level)
maxLevel = 9                     # finest leaf level (interface region)

# ---- fluids: phase 1 is where f = 1, phase 2 where f = 0
rho1 = 1                         # density of phase 1
rho2 = 0.001176470588235294      # density of phase 2
mu1 = 0.00039374024864306047     # dynamic viscosity of phase 1
mu2 = 7.69784306335871e-06       # dynamic viscosity of phase 2
sigma = 0.0009988235294117647    # surface tension coefficient
rejectUnresolvedCurvature = false # no surface tension on sub-cell structures (true/false)
gx = 0                           # gravity x
gy = -1                          # gravity y

# ---- time integration
tEnd = 25.132741228718345        # final time
cfl = 0.25                       # advective CFL number (<= 0.5)
dtMax = 0.01                     # maximum time step
dtMin = 1e-12                    # abort if the time step falls below this
maxSteps = 100000000             # maximum number of time steps
implicitViscosity = true         # implicit viscous term (true/false)
conservingMomentum = true        # momentum advected with the VOF fluxes (true/false)
macPredictor = false             # MAC-projected advection velocity at t+dt/2 (true/false)

# ---- boundary conditions: wall|slip|inflow|outflow|periodic; _u, _v: wall (lid) or inflow velocity; _f: inflow volume fraction
bc_left = periodic               # type
bc_left_u = 0                    # x velocity
bc_left_v = 0                    # y velocity
bc_left_f = 0                    # inflow volume fraction
bc_right = periodic              # type
bc_right_u = 0                   # x velocity
bc_right_v = 0                   # y velocity
bc_right_f = 0                   # inflow volume fraction
bc_bottom = slip                 # type
bc_bottom_u = 0                  # x velocity
bc_bottom_v = 0                  # y velocity
bc_bottom_f = 0                  # inflow volume fraction
bc_top = slip                    # type
bc_top_u = 0                     # x velocity
bc_top_v = 0                     # y velocity
bc_top_f = 0                     # inflow volume fraction

# ---- adaptivity
adaptEvery = 2                   # steps between regrids
interfaceBuffer = 4              # max-level cells kept around the interface
uTol = 0.01                      # velocity wavelet threshold (absolute)
adaptVelocity = true             # use the velocity criterion away from the interface

# ---- linear solver
poissonTol = 1e-09               # relative residual tolerance
poissonMaxIter = 1000            # maximum iterations

# ---- kinematic runs (prescribed stream function, no Navier-Stokes)
vofOnly = false                  # advect f with the case's stream function only
period = 0                       # period of time-reversing prescribed flows
